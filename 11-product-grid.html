
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h1 { text-align: center; }

        .product-grid {
            max-width: 1100px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .product {
            padding: 15px;
            background: white;
            border-radius: 10px;
            transition: box-shadow 0.2s;
        }

        .product:hover {
            box-shadow: 0 6px 18px #00000015;
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
        }

        .product h2 {
            font-size: 18px;
        }

        .price {
            font-weight: bold;
            color: #15803d;
        }

        .product a {
            display: block;
            padding: 10px;
            text-align: center;
            background: #2457a7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        @media (max-width: 850px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>Featured Products</h1>

    <main class="product-grid">
        <article class="product">
            <img src="https://placehold.co/300x200?text=Laptop" alt="Laptop">
            <h2>Laptop</h2>
            <p>For study and work.</p>
            <p class="price">Rs. 45,000</p>
            <a href="#laptop">View Details</a>
        </article>

        <article class="product">
            <img src="https://placehold.co/300x200?text=Phone" alt="Smartphone">
            <h2>Smartphone</h2>
            <p>For everyday communication.</p>
            <p class="price">Rs. 18,000</p>
            <a href="#phone">View Details</a>
        </article>

        <article class="product">
            <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
            <h2>Headphones</h2>
            <p>For music and online classes.</p>
            <p class="price">Rs. 2,000</p>
            <a href="#headphones">View Details</a>
        </article>

        <article class="product">
            <img src="https://placehold.co/300x200?text=Keyboard" alt="Keyboard">
            <h2>Keyboard</h2>
            <p>For comfortable typing.</p>
            <p class="price">Rs. 800</p>
            <a href="#keyboard">View Details</a>
        </article>
    </main>
</body>
</html>
