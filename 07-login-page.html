
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #eaf0f8;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 {
            text-align: center;
            color: #2457a7;
        }

        label {
            display: block;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2457a7;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #173f80;
        }

        .note {
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <form class="login-box" action="#" method="post">
        <h1>Welcome Back</h1>
        <p class="note">Sign in to your account</p>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>

        <p class="note">Demo login page for HTML and CSS practice.</p>
    </form>
</body>
</html>
