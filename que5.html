<!DOCTYPE html>
<html>
<head>
    <title>Lists Example</title>
</head>
<body>

    <!-- Ordered List -->
    <h2>My Top 5 Favorite Programming Languages</h2>
    <ol>
        <li>Python</li>
        <li>c</li>
        <li>html</li>
        <li>C++</li>
        <li>css</li>
    </ol>

    <!-- Unordered List -->
    <h2>My Hobbies and Interests</h2>
    <ul>
        <li>online game</li>
        <li>Playing Football</li>
        <li>Coding</li>
        <li>Listening to Music</li>
        <li>Traveling</li>
    </ul>

</body>
</html>
