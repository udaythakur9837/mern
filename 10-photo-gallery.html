
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 25px;
            background: #f8fafc;
            font-family: Arial, sans-serif;
        }

        h1, .intro { text-align: center; }

        .gallery {
            max-width: 1100px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        figure {
            margin: 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px #00000012;
        }

        figure img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.3s;
        }

        figure:hover img {
            transform: scale(1.04);
        }

        figcaption {
            padding: 13px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 450px) {
            .gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>My Photo Gallery</h1>
    <p class="intro">A collection of beautiful places and views.</p>

    <main class="gallery">
        <figure>
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80"
                 alt="Mountain scenery">
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80"
                 alt="Green forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80"
                 alt="Landscape in nature">
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=600&q=80"
                 alt="Ocean waves">
            <figcaption>Ocean Waves</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                 alt="Beautiful landscape">
            <figcaption>Travel Memories</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=600&q=80"
                 alt="Sunrise over a landscape">
            <figcaption>Morning Sunrise</figcaption>
        </figure>
    </main>
</body>
</html>
