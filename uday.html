    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <body> 
        <form>
        <div align="center">  
        
        
            <h1>REGISTRATION FORM</h1>
            <br>
            <br>
            
            <label for="Name">NAME</label>
            <input id="Enter Name" placeholder="Enter Name" type="Enter Name">
            <br>
            <br>
            <label for="Last Name"> Last NAME </label>
            <input id="Enter Last Name" placeholder="Enter Last Name" type="Enter Last Name">
            <br>
            <br>
            <label for="email address">EMAIL ADDRESS</label>
            <input id="email address" placeholder="email address" type="address">
            <br>
            <br>
            <label for="password">PASSWORD</label>
            <input id="password" placeholder="password" type="password">
            <br>
            <br>
            <label for="gender"> GENDER</label>
            <input type="radio" id="male" value="male">male
            <input type="radio" id="female" value="female"> female
            <input type="radio" id="other" value="other"> female
            <br>
            <br>
            
            <label id="course selection"> COURSE SELECTION :</label>
            <select for="COURSE SELECTION :" name="COURSE SELECTION :">
                <option id="SELECT COURSE"> SELECT COURSE</option>
                <option id="BCA(AI)">BCA(AI)</option>
                <option id="BBA">BBA</option>
                <option id="B.COM">B.COM</option>
                <option id="MBA">MBA</option>
                
            </select>
            <br>
            <br>
            <button type="submit button">submit</button>
            <br>
            <br>
            <button type="Edit button"> Edit</button>
        </div>
        </form>
    </body>
    </html>
