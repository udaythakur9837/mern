
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 25px;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        h1 { text-align: center; }

        .products {
            max-width: 1000px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .product {
            padding: 18px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px #0000000c;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 7px;
        }

        .price {
            color: #15803d;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 5px;
        }

        @media (max-width: 750px) {
            .products { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .products { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>Our Products</h1>

    <main class="products">
        <article class="product">
            <img src="https://placehold.co/400x250?text=Laptop" alt="Laptop">
            <h2>Laptop</h2>
            <p>Suitable for studying and everyday work.</p>
            <p class="price">Rs. 45,000</p>
            <button type="button">View Product</button>
        </article>

        <article class="product">
            <img src="https://placehold.co/400x250?text=Headphones" alt="Headphones">
            <h2>Headphones</h2>
            <p>Wireless headphones for music and calls.</p>
            <p class="price">Rs. 2,000</p>
            <button type="button">View Product</button>
        </article>

        <article class="product">
            <img src="https://placehold.co/400x250?text=Keyboard" alt="Keyboard">
            <h2>Keyboard</h2>
            <p>A practical keyboard for everyday typing.</p>
            <p class="price">Rs. 800</p>
            <button type="button">View Product</button>
        </article>
    </main>
</body>
</html>
