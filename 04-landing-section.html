
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Hub</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 50px 8%;
            background: linear-gradient(135deg, #e0eaff, #f6f8ff);
        }

        .hero-content {
            max-width: 520px;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 54px);
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.7;
            color: #526075;
        }

        .button {
            display: inline-block;
            padding: 13px 22px;
            background: #2457a7;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .hero img {
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
        }

        @media (max-width: 700px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <p>WELCOME TO LEARNING HUB</p>
            <h1>Build Skills for Your Future</h1>
            <p>
                Learn programming, explore technology and practise
                new skills through small projects.
            </p>
            <a class="button" href="#learn">Start Learning</a>
        </div>

        <img src="https://placehold.co/500x400?text=Learning"
             alt="Learning and technology illustration">
    </section>

    <section id="learn" style="padding: 30px; text-align: center;">
        <h2>Learn. Practise. Improve.</h2>
        <p>Take one step forward every day.</p>
    </section>
</body>
</html>
