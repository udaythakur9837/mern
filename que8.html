<!DOCTYPE html>
<html>
<head>
    <title>Friend Form</title>
</head>
<body>
    <center>

    <form>
        <!-- Enter Name -->
        <p>
            Enter Name of your friend 
            <input type="text" name="friendname">
        </p>

        <!-- File Upload -->
        <p>
            Choose the file you want to post to your friend <br>
            <input type="file" name="fileupload">
        </p>

        <!-- File Content -->
        <p>
            What does the file contain? <br>
            <input type="checkbox" name="content" value="Image" checked> Image
            <input type="checkbox" name="content" value="Source code" checked> Source code
            <input type="checkbox" name="content" value="Binary code"> Binary code
        </p>

        <!-- Completion Message -->
        <p>
            You have Completed the Form .
            <input type="submit" value="Submit Query">
        </p>
    </form>
    </center>

</body>
</html>
